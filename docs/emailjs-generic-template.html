<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f9fafb;
      font-family: "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
    }
    .wrapper {
      width: 100%;
      padding: 32px 16px;
      box-sizing: border-box;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      padding: 28px 24px;
      text-align: center;
      color: #ffffff;
    }
    .header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .header p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: .9;
    }
    .content {
      padding: 28px 24px 32px;
      font-size: 15px;
      line-height: 1.8;
    }
    .card {
      background-color: #f3f4f6;
      border-radius: 12px;
      padding: 16px 18px;
      margin: 20px 0 24px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin: 8px 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    .label {
      color: #374151;
      font-weight: 600;
      min-width: 88px;
    }
    .value {
      color: #2563eb;
      font-weight: 600;
      flex: 1;
      text-align: right;
    }
    .divider {
      height: 1px;
      background-color: #e5e7eb;
      margin: 24px 0;
    }
    .btn {
      display: inline-block;
      background-color: #10b981;
      color: #ffffff !important;
      padding: 12px 20px;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .note {
      font-size: 14px;
      color: #374151;
    }
    .footer {
      background-color: #f9fafb;
      border-top: 1px solid #e5e7eb;
      text-align: center;
      padding: 18px 16px 22px;
      font-size: 13px;
      color: #6b7280;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>{{title}}</h1>
        <p>{{brand_name}}</p>
      </div>

      <div class="content">
        {{{intro_html}}}
        {{{details_html}}}
        {{{note_html}}}
        {{{button_html}}}
      </div>

      <div class="footer">
        本郵件由系統自動寄出，請勿直接回覆。<br />
        <a href="{{site_url}}">{{site_url}}</a>
      </div>
    </div>
  </div>
</body>
</html>
